modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/villagercurediscounts/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/villagercurediscounts"
authors="emberbocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Zombie villager cure discounts stack again up to a configurable number of cures, and can be shared with every player.
Only needed on the server: players without the mod can join and see the discounted prices.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
