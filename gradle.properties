org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# The jars are built against 26.1.2 and support 26.1 to 26.1.2; referenced APIs and mixin targets are checked in all three versions.
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.2]
minecraft_label=26.1-26.1.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
# Verify 26.1: ./gradlew :common:compileJava "-Pneo_form_version=26.1-1"
# Verify 26.1.1: ./gradlew :common:compileJava "-Pneo_form_version=26.1.1-1"
neo_form_version=26.1.2-1
neo_version=26.1.2.126
# The lowest NeoForge version the mod declares support for (26.1 and 26.1.1 only have beta builds).
# Verify 26.1: ./gradlew :neoforge:compileJava "-Pneo_version=26.1.0.1-beta"
# Verify 26.1.1: ./gradlew :neoforge:compileJava "-Pneo_version=26.1.1.0-beta"
# Verify 26.1.2: ./gradlew :neoforge:compileJava "-Pneo_version=26.1.2.0-beta"
neo_version_range=[26.1.0.1-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and supports Minecraft 26.1 to 26.1.2 without remapping.
# Verify 26.1: ./gradlew :fabric:compileJava "-Pminecraft_version=26.1" "-Pfabric_api_version=0.144.1+26.1" "-Pfabric_loader_version=0.18.4"
# Verify 26.1.1: ./gradlew :fabric:compileJava "-Pminecraft_version=26.1.1" "-Pfabric_api_version=0.144.1+26.1" "-Pfabric_loader_version=0.18.4"
# Verify 26.1.2: ./gradlew :fabric:compileJava "-Pminecraft_version=26.1.2" "-Pfabric_api_version=0.144.1+26.1" "-Pfabric_loader_version=0.18.4"
fabric_loader_version=0.20.1
# Loader 0.18.2 first parses 26.x versions; the minimum Fabric API requires 0.18.4.
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.155.3+26.1.2
# Minimum Fabric API: 0.144.1 is the first build for the 26.1 release (0.144.0 still targets 26.1-rc-2).
# It includes ServerLifecycleEvents.SERVER_STARTING. Build metadata (+26.1) is ignored in version comparisons.
fabric_api_version_range=>=0.144.1
fabric_minecraft_version_range=>=26.1 <=26.1.2

# Forge. Each Minecraft version has its own series: 62 (26.1), 63 (26.1.1), 64 (26.1.2).
# forge_minecraft_version is separate so Fabric version checks do not change the Forge module.
# Verify 26.1: ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1" "-Pforge_version=62.0.0"
# Verify 26.1.1: ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1.1" "-Pforge_version=63.0.0"
# Verify 26.1.2: ./gradlew :forge:compileJava "-Pforge_minecraft_version=26.1.2" "-Pforge_version=64.0.0"
forge_minecraft_version=26.1.2
forge_version=64.1.6
forge_version_range=[62.0.0,)
forge_loader_version_range=[62,)

# NightConfig is shipped by NeoForge and Forge; the Fabric jar bundles this version.
night_config_version=3.8.0

mod_id=villagercurediscounts
mod_name=Villager Cure Discounts
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.villagercurediscounts
