org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Target Minecraft 26.2 exactly.
minecraft_version=26.2
minecraft_version_range=[26.2]
minecraft_label=26.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
neo_version=26.2.0.93
# The lowest NeoForge version the mod declares support for (the first 26.2 build, a beta).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.2.0.0-beta"
neo_version_range=[26.2.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version without remapping.
# Verify with: ./gradlew :fabric:compileJava "-Pfabric_api_version=0.152.2+26.2" "-Pfabric_loader_version=0.18.4"
fabric_loader_version=0.20.1
# The minimum Fabric API requires Loader 0.18.4.
fabric_loader_version_range=>=0.18.4
fabric_api_version=0.161.0+26.2
# Minimum Fabric API: 0.152.2 is the first build for the 26.2 release (0.152.1 still targets 26.2-rc-2).
# It includes ServerLifecycleEvents.SERVER_STARTING. Build metadata (+26.2) is ignored in version comparisons.
fabric_api_version_range=>=0.152.2
fabric_minecraft_version_range=26.2

# Forge. 26.2 uses the 65 series.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=65.0.0"
forge_version=65.1.6
forge_version_range=[65.0.0,)
forge_loader_version_range=[65,)

# NightConfig is shipped by NeoForge and Forge; the Fabric jar bundles this version.
night_config_version=3.8.0

mod_id=villagercurediscounts
mod_name=Villager Cure Discounts
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.villagercurediscounts
